<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kafka Kopanda</title>
    <script defer src="./assets/app.js"></script>
    <script defer src="./demo-format.js"></script>
  </head>
  <body>
    <div id="app"></div>
    
<script>
(function(){
  var KEY='kopanda-demo-notice';
  function show(){
    try{if(sessionStorage.getItem(KEY))return}catch(e){}
    var h=location.hash;if(h&&h!=='#/'&&h!=='#')return;
    var b=document.createElement('div');b.id='demoNoticeBackdrop';
    b.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30000;display:flex;align-items:center;justify-content:center;padding:16px';
    b.innerHTML='<div style="background:#fff;border-radius:12px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:22px 22px 18px;font-family:-apple-system,\'Malgun Gothic\',sans-serif"><div style="font-weight:700;font-size:17px;margin-bottom:10px;color:#409eff">데모 안내</div><div style="font-size:14px;line-height:1.6;color:#333">이 화면은 실제 Kafka 서버 없이 <b>더미 데이터</b>로만 동작하는 데모입니다.<br>연결·토픽 생성·메시지 전송 등은 화면에서만 동작하며 실제 클러스터에는 반영되지 않습니다.<br><span style="color:#888;font-size:12px">입력한 내용은 이 브라우저에만 임시 저장됩니다.</span></div><div style="text-align:right;margin-top:16px"><button type="button" id="demoNoticeOk" style="background:#409eff;color:#fff;border:0;border-radius:6px;padding:7px 18px;font-size:14px;cursor:pointer">확인</button></div></div>';
    document.body.appendChild(b);
    function close(){try{sessionStorage.setItem(KEY,'1')}catch(e){}b.remove()}
    document.getElementById('demoNoticeOk').addEventListener('click',close);
    b.addEventListener('click',function(e){if(e.target===b)close()});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(show,300)});else setTimeout(show,300);
})();
</script>
  </body>
</html>
