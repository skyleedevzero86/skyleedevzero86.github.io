<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kafka Kopanda</title>
    <script defer src="./assets/app.js"></script>
    <script defer src="./demo-format.js"></script>
  </head>
  <body>
    <div id="app"></div>
    
<script>
(function(){
  var KEY='kopanda-demo-notice';
  function show(){
    try{if(sessionStorage.getItem(KEY))return}catch(e){}
    var h=location.hash;if(h&&h!=='#/'&&h!=='#')return;
    var b=document.createElement('div');b.id='demoNoticeBackdrop';
    b.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30000;display:flex;align-items:center;justify-content:center;padding:16px;overscroll-behavior:contain;touch-action:none';
    b.innerHTML='<div style="position:relative;background:#fff;border-radius:12px;max-width:min(380px,calc(100vw - 32px));width:100%;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:22px 22px 18px;font-family:-apple-system,\'Malgun Gothic\',sans-serif;touch-action:auto"><button type="button" id="demoNoticeX" aria-label="닫기" style="position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:#f1f3f5;color:#333;font-size:20px;line-height:36px;cursor:pointer">&times;</button><div style="font-weight:700;font-size:17px;margin-bottom:10px;color:#409eff">데모 안내</div><div style="font-size:14px;line-height:1.6;color:#333">이 화면은 실제 Kafka 서버 없이 <b>더미 데이터</b>로만 동작하는 데모입니다.<br>연결·토픽 생성·메시지 전송 등은 화면에서만 동작하며 실제 클러스터에는 반영되지 않습니다.<br><span style="color:#888;font-size:12px">입력한 내용은 이 브라우저에만 임시 저장됩니다.</span></div><div style="text-align:right;margin-top:16px"><button type="button" id="demoNoticeOk" style="background:#409eff;color:#fff;border:0;border-radius:6px;padding:7px 18px;font-size:14px;cursor:pointer">확인</button></div></div>';
    document.body.appendChild(b);
    var H=document.documentElement,B=document.body,ph=H.style.overflow,pb=B.style.overflow;H.style.overflow='hidden';B.style.overflow='hidden';
    function close(){try{sessionStorage.setItem(KEY,'1')}catch(e){}H.style.overflow=ph;B.style.overflow=pb;b.remove()}
    document.getElementById('demoNoticeOk').addEventListener('click',close);
    document.getElementById('demoNoticeX').addEventListener('click',close);
    b.addEventListener('click',function(e){if(e.target===b)close()});
  }
  // 데모 안내 팝업 임시 숨김: 다시 보이게 하려면 아래 줄의 주석(//)을 푼다
  // if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(show,300)});else setTimeout(show,300);
})();
</script>
  </body>
</html>
